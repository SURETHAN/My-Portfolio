# ------------------------------------------------------------------
# Edge Apache vhost — surethan.zeal.ninja
# Place on the public host (e.g. /etc/apache2/sites-available/,
# then: a2ensite surethan-portfolio && a2enmod proxy proxy_http headers
#       && systemctl reload apache2)
#
# Proxies to the lab machine running `docker compose up -d --build`
# (Traefik listening on HTTP_PORT, default here: 8123).
# ------------------------------------------------------------------
<VirtualHost *:80>
    ServerName surethan.zeal.ninja
    ProxyRequests Off
    ProxyPreserveHost On

    # TLS terminates at this edge; tells PHP to emit HSTS + secure cookies
    RequestHeader set X-Forwarded-Proto "https"

    ProxyPass        / http://172.30.23.155:8123/
    ProxyPassReverse / http://172.30.23.155:8123/

    ErrorLog ${APACHE_LOG_DIR}/surethan-portfolio-error.log
    CustomLog ${APACHE_LOG_DIR}/surethan-portfolio-access.log combined
</VirtualHost>
